<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableros Financieros</title>
<style>
  body { margin:0; font-family:system-ui, sans-serif; }
  nav { display:flex; gap:4px; padding:8px; background:#1f2937; }
  nav button { padding:8px 16px; border:0; border-radius:6px; cursor:pointer;
               background:#374151; color:#fff; }
  nav button.activo { background:#2563eb; }
  iframe { width:100%; height:calc(100vh - 52px); border:0; }
</style>
</head>
<body>
  <nav>
    <button class="activo" onclick="ver('pyg.html', this)">P&amp;G</button>
    <button onclick="ver('modalidades.html', this)">Modalidades</button>
  </nav>
  <iframe id="marco" src="pyg.html"></iframe>
<script>
  function ver(archivo, boton) {
    document.getElementById('marco').src = archivo;
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('activo'));
    boton.classList.add('activo');
  }
</script>
</body>
</html>
